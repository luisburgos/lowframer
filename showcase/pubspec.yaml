name: lowframer_showcase
description: "The lowframer showcase: every primitive as a playground, and the compositions built from them."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  lowframer:
    path: ../
  playgrounder: ^0.3.1
  # The gallery shell the example's art grid is laid out by.
  showcaser: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
