name: lowframer_example
description: A small gallery of lowframer wireframe art.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  lowframer:
    path: ../
  playgrounder: ^0.2.0
  # The gallery shell the example's art grid is laid out by. A git dependency
  # while showcaser is unpublished; swaps to the pub version at its release.
  showcaser:
    git:
      url: https://github.com/luisburgos/showcaser
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
