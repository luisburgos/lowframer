name: lowframer_example
description: A small gallery of lowframer wireframe art.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  lowframer:
    path: ../
  playgrounder: ^0.2.0
  # The gallery shell the example's art grid is laid out by. Pinned to a tag
  # rather than a branch: `ref: main` is a moving target that a `pub upgrade`
  # would follow. Swaps to the pub version once showcaser is published.
  showcaser:
    git:
      url: https://github.com/luisburgos/showcaser
      ref: "0.1.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
