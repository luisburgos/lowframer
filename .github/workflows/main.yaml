name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  semantic_pull_request:
    permissions:
      pull-requests: read
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  # CHANGELOG.md is auto-generated from git history by conventional-changelog,
  # so it carries verbatim commit subjects (including any historical typos)
  # rather than authored prose. Spell-gating it would fail the build on words
  # nobody can edit without rewriting history.
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !CHANGELOG.md
      modified_files_only: false

  # .fvmrc is the single source of truth for the SDK version: it is what the
  # local `fvm flutter` uses, so reading it here keeps CI and developer
  # machines on the same SDK instead of drifting apart silently.
  flutter_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read .fvmrc
        id: read
        run: |
          version=$(jq -er '.flutter' .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Flutter $version (from .fvmrc)"

  build:
    needs: flutter_version
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: ${{ needs.flutter_version.outputs.version }}

  # The example is a separate package, excluded from the root analysis
  # options, so the job above never sees it. Without this it breaks silently
  # whenever the library's API changes.
  # Both are separate packages, excluded from the root analysis options, so
  # the build job never sees them. Without this they break silently whenever
  # the library's API changes.
  sub_packages:
    needs: flutter_version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [example, showcase]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.flutter_version.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Only if the sub-package has tests: the example has none, and a bare
      # `flutter test` fails rather than skipping when there is no test dir.
      - name: Test
        run: '[ -d test ] && flutter test || echo "no tests in ${{ matrix.package }}"'

  # A version bump must arrive as its own PR.
  #
  # This repository squash-merges, so a bump committed inside a feature branch
  # is erased along with the rest of that branch's history: the release leaves
  # no `chore(release)` commit on main and becomes invisible in `git log`.
  # That is what happened to 0.3.0, whose bump vanished into the feature PR
  # that carried it, unlike 0.2.0's own `86c8789`.
  #
  # The rule is mechanical, so it is enforced mechanically rather than
  # remembered: a PR that changes the version may change nothing else.
  version_bump_is_alone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The three-dot diff below needs the merge base, not a shallow tip.
          fetch-depth: 0

      - name: A version bump must be its own PR
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"

          version_touched=false
          if git diff "$base"...HEAD -- pubspec.yaml | grep -qE '^\+version:'; then
            version_touched=true
          fi
          if git diff "$base"...HEAD -- package.json | grep -qE '^\+  "version"'; then
            version_touched=true
          fi

          if [ "$version_touched" = false ]; then
            echo "No version change in this PR. Nothing to check."
            exit 0
          fi

          # The files CONTRIBUTING requires to move together for a release,
          # plus the two the bump regenerates.
          allowed="pubspec.yaml package.json package-lock.json README.md CHANGELOG.md"

          # Read line by line: paths may contain spaces, so word splitting the
          # whole list is not safe.
          offending=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case " $allowed " in
              *" $f "*) ;;
              *) offending="$offending $f" ;;
            esac
          done < <(git diff --name-only "$base"...HEAD)

          if [ -n "$offending" ]; then
            echo "::error::A version bump must be its own PR. This one also changes:$offending"
            echo ""
            echo "Land the other work first, then open a separate"
            echo "'chore(release): bump to X.Y.Z' PR touching only:"
            echo "  $allowed"
            exit 1
          fi

          echo "Version bump is alone. OK."
